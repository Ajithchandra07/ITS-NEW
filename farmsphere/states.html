<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>States — FarmSphere</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <link href="/assets/css/styles.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/index.html" class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-primary-600 text-white flex items-center justify-center font-bold">FS</div>
          <span class="sr-only">FarmSphere</span>
        </a>
        <nav class="hidden md:flex items-center gap-6 text-sm">
          <a href="/crops.html" class="hover:text-primary-700">Crops</a>
          <a href="/states.html" class="hover:text-primary-700">States</a>
          <a href="/dashboard.html" class="hover:text-primary-700">Dashboard</a>
          <a href="/login.html" class="inline-flex items-center justify-center rounded-md bg-primary-600 px-3.5 py-1.5 text-white hover:bg-primary-700">Login</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold">States</h1>
      <input id="search" type="search" placeholder="Search states..." class="w-64 rounded-md border border-gray-300 px-3 py-2" />
    </div>

    <div id="grid" class="mt-6 grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <footer class="border-t border-gray-200 py-8 mt-16 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-sm text-gray-600 flex flex-col md:flex-row items-center justify-between gap-3">
      <p>© <span id="year"></span> FarmSphere.</p>
      <div class="flex items-center gap-4">
        <a href="/dashboard.html" class="hover:text-primary-700">Survey & Reports</a>
      </div>
    </div>
  </footer>

  <script src="/assets/js/app.js"></script>
  <script>
    let states = [];
    const grid = document.getElementById('grid');
    const searchEl = document.getElementById('search');

    function render() {
      const q = (searchEl.value || '').toLowerCase();
      const filtered = states.filter(s => s.state.toLowerCase().includes(q));
      grid.innerHTML = filtered.map(s => `
        <a href="/state.html?name=${encodeURIComponent(s.state)}" class="card block hover:shadow-md transition">
          <div class="flex items-center justify-between">
            <h3 class="font-semibold">${s.state}</h3>
            <span class="badge badge-amber">6-month trend</span>
          </div>
          <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
            <div class="rounded-lg bg-gray-50 p-2">
              <div class="text-gray-500">Agri GDP (Cr)</div>
              <div class="font-medium">${FarmSphere.formatNumber(s.agricultureGdpInCr)}</div>
            </div>
            <div class="rounded-lg bg-gray-50 p-2">
              <div class="text-gray-500">Dairy GDP (Cr)</div>
              <div class="font-medium">${FarmSphere.formatNumber(s.dairyGdpInCr)}</div>
            </div>
          </div>
        </a>
      `).join('');
    }

    (async function() {
      try {
        const gdp = await FarmSphere.fetchJSON('/data/gdp.json');
        states = gdp.states;
        render();
      } catch (e) { console.error(e); }
    })();

    searchEl.addEventListener('input', render);
  </script>
</body>
</html>
