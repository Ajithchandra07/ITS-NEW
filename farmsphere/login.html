<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FarmSphere</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <link href="/assets/css/styles.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/index.html" class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-primary-600 text-white flex items-center justify-center font-bold">FS</div>
          <span class="sr-only">FarmSphere</span>
        </a>
        <nav class="hidden md:flex items-center gap-6 text-sm">
          <a href="/crops.html" class="hover:text-primary-700">Crops</a>
          <a href="/states.html" class="hover:text-primary-700">States</a>
          <a href="/dashboard.html" class="hover:text-primary-700">Dashboard</a>
          <a href="/login.html" class="inline-flex items-center justify-center rounded-md bg-primary-600 px-3.5 py-1.5 text-white hover:bg-primary-700">Login</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h1 class="text-2xl font-bold">Login</h1>
    <p class="mt-2 text-sm text-gray-600">Select your role to personalize insights.</p>

    <div class="mt-6 space-y-3">
      <button data-role="farmer" class="w-full rounded-md bg-primary-600 px-3.5 py-2 text-white hover:bg-primary-700">Farmer</button>
      <button data-role="policymaker" class="w-full rounded-md border border-gray-300 px-3.5 py-2 hover:bg-gray-100">Policymaker</button>
      <button data-role="researcher" class="w-full rounded-md border border-gray-300 px-3.5 py-2 hover:bg-gray-100">Researcher</button>
    </div>
  </main>

  <footer class="border-t border-gray-200 py-8 mt-16 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-sm text-gray-600 flex flex-col md:flex-row items-center justify-between gap-3">
      <p>© <span id="year"></span> FarmSphere.</p>
      <div class="flex items-center gap-4">
        <a href="/dashboard.html" class="hover:text-primary-700">Go to Dashboard</a>
      </div>
    </div>
  </footer>

  <script src="/assets/js/app.js"></script>
  <script>
    document.querySelectorAll('button[data-role]').forEach(btn => {
      btn.addEventListener('click', () => {
        const role = btn.getAttribute('data-role');
        FarmSphere.saveRole(role);
        location.href = '/dashboard.html';
      });
    });
  </script>
</body>
</html>
