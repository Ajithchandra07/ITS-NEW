<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey & GDP Dashboard — FarmSphere</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <link href="/assets/css/styles.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/index.html" class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-primary-600 text-white flex items-center justify-center font-bold">FS</div>
          <span class="sr-only">FarmSphere</span>
        </a>
        <nav class="hidden md:flex items-center gap-6 text-sm">
          <a href="/crops.html" class="hover:text-primary-700">Crops</a>
          <a href="/states.html" class="hover:text-primary-700">States</a>
          <a href="/dashboard.html" class="hover:text-primary-700">Dashboard</a>
          <a href="/login.html" class="inline-flex items-center justify-center rounded-md bg-primary-600 px-3.5 py-1.5 text-white hover:bg-primary-700">Login</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold">Survey & GDP Dashboard</h1>
      <button id="download" class="rounded-md bg-primary-600 px-3.5 py-2 text-white hover:bg-primary-700">Download Report</button>
    </div>

    <div class="mt-6 grid md:grid-cols-2 gap-6">
      <div class="card"><h2 class="font-semibold">National: Agri vs Dairy</h2><canvas id="nationalPie" height="200"></canvas></div>
      <div class="card"><h2 class="font-semibold">Top States by Agri GDP</h2><canvas id="topAgri" height="200"></canvas></div>
      <div class="card"><h2 class="font-semibold">Top States by Dairy GDP</h2><canvas id="topDairy" height="200"></canvas></div>
      <div class="card"><h2 class="font-semibold">Potential Gap Crops</h2>
        <ul id="gapList" class="mt-3 space-y-2 text-sm"></ul>
      </div>
    </div>
  </main>

  <footer class="border-t border-gray-200 py-8 mt-16 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-sm text-gray-600 flex flex-col md:flex-row items-center justify-between gap-3">
      <p>© <span id="year"></span> FarmSphere.</p>
      <div class="flex items-center gap-4">
        <a href="/index.html#" class="hover:text-primary-700">Home</a>
      </div>
    </div>
  </footer>

  <script src="/assets/js/app.js"></script>
  <script>
    const charts = {};
    function destroy(id){ if (charts[id]) { charts[id].destroy(); delete charts[id]; } }
    (async function() {
      const gdp = await FarmSphere.fetchJSON('/data/gdp.json');
      const crops = await FarmSphere.fetchJSON('/data/crops.json');

      const nationalPieEl = document.getElementById('nationalPie').getContext('2d');
      destroy('nationalPie');
      charts['nationalPie'] = new Chart(nationalPieEl, {
        type: 'doughnut',
        data: { labels: ['Agriculture', 'Dairy', 'Other'], datasets: [{ data: [gdp.national.agriculturePercent, gdp.national.dairyPercent, 100 - gdp.national.agriculturePercent - gdp.national.dairyPercent], backgroundColor: ['#10b981', '#34d399', '#cbd5e1'], borderWidth: 0 }]},
        options: { plugins: { legend: { position: 'bottom' } } }
      });

      const topAgri = [...gdp.states].sort((a,b)=>b.agricultureGdpInCr-a.agricultureGdpInCr).slice(0,5);
      const topAgriEl = document.getElementById('topAgri').getContext('2d');
      destroy('topAgri');
      charts['topAgri'] = new Chart(topAgriEl, {
        type: 'bar',
        data: { labels: topAgri.map(s=>s.state), datasets: [{ data: topAgri.map(s=>s.agricultureGdpInCr), backgroundColor: '#10b981', borderRadius: 6 }] },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
      });

      const topDairy = [...gdp.states].sort((a,b)=>b.dairyGdpInCr-a.dairyGdpInCr).slice(0,5);
      const topDairyEl = document.getElementById('topDairy').getContext('2d');
      destroy('topDairy');
      charts['topDairy'] = new Chart(topDairyEl, {
        type: 'bar',
        data: { labels: topDairy.map(s=>s.state), datasets: [{ data: topDairy.map(s=>s.dairyGdpInCr), backgroundColor: '#34d399', borderRadius: 6 }] },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
      });

      // Gap crops: high-demand category
      const gapList = document.getElementById('gapList');
      const gaps = crops.crops.filter(c => c.category === 'high-demand').slice(0,8);
      gapList.innerHTML = gaps.map(c => `<li><a class="text-primary-700 hover:underline" href="/crop.html?id=${encodeURIComponent(c.id)}">${c.name}</a> — <span class="text-gray-500">${c.subtitle}</span></li>`).join('');

      document.getElementById('download').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify({ gdp, crops }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'farmsphere-report.json'; a.click();
        URL.revokeObjectURL(url);
      });
    })();
  </script>
</body>
</html>
